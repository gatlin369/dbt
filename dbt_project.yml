# ==============================================================
#  Project
# ==============================================================

name: 'my_new_project'
version: '1.0.0'
config-version: 2

profile: 'default'


# ==============================================================
#  Paths
# ==============================================================

model-paths:    ["models"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"


# ==============================================================
#  Variables
#  Override at runtime, e.g.:
#    dbt build --vars '{"mrg_cc_database": "PROD_DB"}'
# ==============================================================

vars:
  # Guidewire ClaimCenter merged layer (source: mrg_cc)
  mrg_cc_database: "DEV1E2E"
  mrg_cc_schema: "MRG_CC"

  ctrl_db: DEV_DBT
  ctrl_schema: DBT_SHAK


# ==============================================================
#  Models
#  Project default is table; *_inc models override to incremental
# ==============================================================

models:
  my_new_project:
    +materialized: table
